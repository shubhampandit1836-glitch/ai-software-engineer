# WHY: CI runs on every push + pull request. If a change breaks routing,
# the scanner, or a parser, we know in 60 seconds - not during a demo.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      # WHY: checkout@v4 pins the action version - same discipline as
        # pinning pip versions. v4 is the current stable major.
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHY: cache the uv-managed venv keyed on the lockfile. Cuts CI from
      # ~2 min to ~30s on subsequent runs - deps only reinstall when
      # requirements change.
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('backend/requirements.txt') }}-${{ hashFiles('backend/requirements-dev.txt') }}

      # WHY: pip here instead of uv - uv isn't preinstalled on GitHub
      # runners, and pip is always present. Installing uv adds more
      # moving parts than it removes for a single job.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # WHY: DUMMY SECRETS. Importing app modules constructs LLM clients
      # at import time - they need env vars to EXIST. But our unit tests
      # never call any API, so a fake key passes construction and is
      # never validated. Real keys NEVER go in workflow files.
      - name: Set dummy env vars
        run: echo "GROQ_API_KEY=gci-dummy-key-for-import-only" >> $GITHUB_ENV

      - name: Run unit tests
        run: python -m pytest