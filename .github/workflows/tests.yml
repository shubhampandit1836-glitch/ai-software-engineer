# WHY: CI runs on every push + pull request. If a change breaks routing,
# the scanner, or a parser, we know in 60 seconds - not during a demo.
name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # WHY: pip (not uv) - pip is preinstalled on GitHub runners.
      # We install into the system Python, so there is no venv to cache.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      # WHY: DUMMY SECRETS. Importing app modules constructs LLM clients
      # at import time - env vars must EXIST. Unit tests never call any
      # API, so a fake key passes construction and is never validated.
      # Real keys NEVER go in workflow files.
      - name: Set dummy env vars
        run: |
          echo "GROQ_API_KEY=gci-dummy-key-for-import-only" >> $GITHUB_ENV
          echo "DATABASE_URL=postgresql://user:pass@localhost:5432/db" >> $GITHUB_ENV

      - name: Run unit tests
        run: python -m pytest